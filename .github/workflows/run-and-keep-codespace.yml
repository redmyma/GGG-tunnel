name: Auto Run GG-Tunnel and Save Config

on:
  workflow_dispatch:

jobs:
  auto-run-codespace:
    name: Auto Run GG-Tunnel in Codespace
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Auth with GitHub CLI (Smart Auth)
        id: auth_step
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            echo "PAT_TOKEN found in secrets. Logging in using token..."
            echo "${{ secrets.PAT_TOKEN }}" | gh auth login --with-token
            gh auth status
          else
            echo "PAT_TOKEN is missing! Switching to Interactive Device Web Flow..."
            echo "--------------------------------------------------------"
            echo "Please look at the output below, copy the code, and open:"
            echo "https://github.com/login/device"
            echo "--------------------------------------------------------"
            
            timeout 300 gh auth login --web --scopes "repo,codespace,workflow" || {
              echo "Authentication timeout or failed after 5 minutes."
              exit 1
            }
            
            echo "Device Authentication Successful!"
            gh auth status
          fi

      - name: Create codespace
        id: create_cs
        run: |
          echo "Creating codespace from ${{ github.repository }}..."
          
          RAW_OUTPUT=$(gh codespace create \
            --repo ${{ github.repository }} \
            --branch main \
            --machine basicLinux32gb \
            --display-name "gg-tunnel-run-$(date +%Y%m%d-%H%M%S)" \
            --idle-timeout 30m \
            --retention-period 24h)
          
          echo "Raw output: $RAW_OUTPUT"
          
          CS_NAME=$(echo "$RAW_OUTPUT" | grep -o '[a-zA-Z0-9-]\+-[a-zA-Z0-9]\+-[a-zA-Z0-9]\+-[a-zA-Z0-9]\+' | head -n 1)
          
          if [ -z "$CS_NAME" ]; then
            CS_NAME=$(echo "$RAW_OUTPUT" | tail -n 1)
          fi
          
          if [ -z "$CS_NAME" ] || [[ "$CS_NAME" == *"error"* ]]; then
            echo "Failed to create codespace"
            exit 1
          fi
          
          echo "cs_name=$CS_NAME" >> $GITHUB_OUTPUT
          echo "Codespace created: $CS_NAME"

      - name: Wait for codespace initialization
        run: |
          echo "Waiting 60 seconds for core components..."
          sleep 60

      - name: Trigger Devcontainer PostAttach and Capture Configs
        run: |
          CS="${{ steps.create_cs.outputs.cs_name }}"
          
          if [ -z "$CS" ]; then
            echo "No codespace found"
            exit 1
          fi
          
          echo "Connecting via SSH to trigger lifecycle events..."
          
          gh codespace ssh -c "$CS" -- bash -c '
            echo "=== TRIGGERING INTERNAL SCRIPTS ==="
            sleep 10
            echo "=== CHECKING XRAY LOGS AS BACKUP ==="
            if [ -f "/tmp/xray.log" ]; then
              cat /tmp/xray.log | tail -n 20
            fi
          ' 2>&1 | tee terminal_full_output.log

      - name: Extract config
        run: |
          if grep -q "G-Tunnel GAMING CONFIGS" terminal_full_output.log; then
            echo "Target config found! Extracting..."
            sed -n '/G-Tunnel GAMING CONFIGS/,$p' terminal_full_output.log > Config.txt
          else
            echo "Target config pattern not found in stdout. Saving full logs to Config.txt for debugging."
            cat terminal_full_output.log > Config.txt
          fi

      - name: Save Config.txt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Config.txt
          git commit -m "Update Config.txt [skip ci]" || true
          git push origin main || true

      - name: Cleanup Codespace
        if: always()
        run: |
          CS="${{ steps.create_cs.outputs.cs_name }}"
          if [ -n "$CS" ]; then
            echo "Deleting codespace: $CS"
            gh codespace delete -c "$CS" --force || true
          fi
